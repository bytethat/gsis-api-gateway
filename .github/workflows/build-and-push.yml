name: "API: Publish Docker Image"

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Artifact Version
        id: get-version
        uses: bytethat/github-actions/artifact-get-version@main
        with:
          artifact-id: 'gsis-api-gateway'
          artifact-type: 'docker'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Private Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bytethat.gr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: registry.bytethat.gr/gsis-api-gateway:${{ github.event.inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Persist Artifact Version
        uses: bytethat/github-actions/artifact-set-version@main
        with:
          artifact-id: 'gsis-api-gateway'
          artifact-type: 'docker'
          version: '${{ steps.get-version.outputs.version }}'