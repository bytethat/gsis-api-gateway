info:
  name: Registry Lookup
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/v1/gsis/registry/lookup/:vat
  headers:
    - name: X-GSIS-Username
      value: "{{gsis_registry_username}}"
    - name: X-GSIS-Password
      value: "{{gsis_registry_password}}"
    - name: X-GSIS-CalledBy
      value: "{{gsis_registry_calledby}}"
  params:
    - name: vat
      value: "803237662"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
