info:
  name: Get Identity Types
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/v1/gsis/39a/identity-types"
  headers:
    - name: X-GSIS-Username
      value: "{{gsis_39a_username}}"
    - name: X-GSIS-Password
      value: "{{gsis_39a_password}}"
    - name: X-GSIS-CalledBy
      value: "{{gsis_39a_calledby}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
