info:
  name: Get Buyer Representative
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/gsis/39a/buyer/:vat/representatives/:representative"
  headers:
    - name: X-GSIS-Username
      value: "{{gsis_39a_username}}"
    - name: X-GSIS-Password
      value: "{{gsis_39a_password}}"
    - name: X-GSIS-CalledBy
      value: "{{gsis_39a_calledby}}"
  params:
    - name: representative
      value: "152731344"
      type: path
    - name: vat
      value: "803237662"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
