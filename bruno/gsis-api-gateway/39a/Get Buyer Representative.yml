info:
  name: Get Buyer Representative
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8080/api/v1/gsis/39a/buyer/:vat/representatives
  headers:
    - name: X-GSIS-Username
      value: "{{gsis_39a_username}}"
    - name: X-GSIS-Password
      value: "{{gsis_39a_password}}"
    - name: X-GSIS-CalledBy
      value: "{{gsis_39a_calledby}}"
  params:
    - name: vat
      value: "803237662"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
