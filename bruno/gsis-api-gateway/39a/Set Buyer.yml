info:
  name: Set Buyer
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/gsis/39a/buyer/:vat"
  headers:
    - name: X-GSIS-Username
      value: "{{gsis_39a_username}}"
    - name: X-GSIS-Password
      value: "{{gsis_39a_password}}"
    - name: X-GSIS-CalledBy
      value: "{{gsis_39a_calledby}}"
  params:
    - name: vat
      value: "803237662"
      type: path
  body:
    type: json
    data: |-
      {
        "email": "finance@byethat.gr",
        "mobile": "6949028294"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
